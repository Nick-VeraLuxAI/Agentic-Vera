# Production-oriented layout: API + optional worker. Mount models/ and build/bin/llama-cli from host for local inference.
services:
  vera:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - vera-db:/app/memory
      - vera-queue:/app/orchestration
      # Uncomment to use host-built llama-cli + GGUF:
      # - ./build/bin:/app/build/bin:ro
      # - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 50s

  worker:
    build: .
    command: ["node", "scripts/run-worker.js"]
    env_file:
      - .env
    volumes:
      - vera-db:/app/memory
      - vera-queue:/app/orchestration
      # - ./build/bin:/app/build/bin:ro
      # - ./models:/app/models:ro
    restart: unless-stopped
    depends_on:
      - vera

volumes:
  vera-db:
  vera-queue:
