apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-vera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-vera
  template:
    metadata:
      labels:
        app: agentic-vera
    spec:
      containers:
        - name: vera
          image: agentic-vera:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: vera-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-vera
spec:
  selector:
    app: agentic-vera
  ports:
    - port: 3000
      targetPort: 3000
